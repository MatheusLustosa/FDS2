<h1>Documentos</h1>
{% load static %}
    <link rel="icon" href="{% static 'alpha.ico' %}" type="image/x-icon">
    <ul>

        {% for documento in documentos %}
                <li>
                    <a href="{{ documento.arquivo.url }}" target="_blank">{{ documento }}</a>
                </li>
        {% empty %}

        {% endfor %}

    </ul>
